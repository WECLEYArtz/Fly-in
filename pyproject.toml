[project]
name = "fly-in"
version = "1"
description = "Flyin: Drones simulation on a graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.3.1",
    "webcolors>=25.10.0",
]

[tool.black]
line-length = 79   

[tool.flake8]
exclude = [".venv"]   
